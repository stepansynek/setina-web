<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Standard</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#0f2a44;font-family:"Helvetica Neue",Arial,sans-serif}
.hero{height:620px;background:linear-gradient(90deg,rgba(15,42,68,.9),rgba(15,42,68,.35)),repeating-linear-gradient(45deg,#3b4b5a 0 40px,#2e3d4b 40px 80px);color:#fff;position:relative}
nav{display:flex;gap:30px;align-items:center;padding:24px 64px;font-size:16px}
nav b{font-size:26px;margin-right:auto}
h1{position:absolute;left:64px;top:170px;width:760px;font-size:72px;line-height:1.02}
p{position:absolute;left:64px;top:360px;width:600px;font-size:20px;line-height:1.5;opacity:.85}
.btn{position:absolute;left:64px;top:470px;background:#1f6fb2;padding:18px 28px;font-weight:700;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:0 64px;margin-top:-60px;position:relative}
.cards div{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:28px;height:220px;font-size:22px;font-weight:700}
</style></head><body>
<div class="hero"><nav><b>SETINA</b><span>Služby</span><span>Strojový park</span><span>Reference</span><span>O nás</span><span>Kontakt</span></nav>
<h1>Přesné CNC obrábění na zakázku</h1><p>Soustružení, frézování, broušení a svařování pro průmyslové zákazníky z Jihomoravského kraje.</p><span class="btn">Nezávazná poptávka</span></div>
<div class="cards"><div>Soustružení</div><div>Frézování</div><div>Broušení</div><div>Svařování</div></div>
</body></html>
